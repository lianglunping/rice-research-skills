# Species Profile: 葡萄 (Vitis vinifera) + Phytozome_v13
# Usage: /bsa-init --profile grape-vvinifera-phytozome --config your-project.yaml
# 只含物种/参考/注释默认值, 项目级字段由 your-project.yaml 覆盖

species:
  name: Vitis vinifera
  common_name: grape
  ploidy: 2

reference:
  assembly_id: Vvinifera_457_Genoscope.12X
  annotation_source: Phytozome_v13
  chrom_regex: '^chr[0-9]+$'
  chrom_list:
    - chr1
    - chr2
    - chr3
    - chr4
    - chr5
    - chr6
    - chr7
    - chr8
    - chr9
    - chr10
    - chr11
    - chr12
    - chr13
    - chr14
    - chr15
    - chr16
    - chr17
    - chr18
    - chr19
  gene_feature_type: gene
  gene_id_regex: 'ID=([^;]+)'
  gene_id_prefix: "VIT_"   # x-doc-only: 文档举例, 不参与解析
