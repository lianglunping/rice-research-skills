# Example: Rice 131-sample resequencing project (802 reference)
# Default policy: GATK workflow with mapping-QC marking enabled.
# The same project can stop at QC-only or BAM-only by changing main.smk includes.

ref: /path/to/remote-home/data/work/131/ref/802.genome.fa
fq_dir: /path/to/remote-home/data/work/131/input/cleandata
bam_dir: /path/to/remote-home/data/work/131/output/01.BWA/bam
base_dir: /path/to/remote-home/data/work/131/output
samples: samples.tsv

# FASTQ naming: {sample}_1.clean.fq.gz / {sample}_2.clean.fq.gz
fq_r1: "{sample}_1.clean.fq.gz"
fq_r2: "{sample}_2.clean.fq.gz"
bam_suffix: sorted.rmdup

tmpdir: /data/tmp

conda:
  align: ngs
  gatk: gatk4
  sv_manta: sv_manta
  sv_delly: SV_PROD
  sv_merge: sv_consensus
  bcftools: ngs

conda_init: "source /path/to/remote-home/miniconda3/etc/profile.d/conda.sh"

resources:
  qc:
    threads: 4
  align:
    threads: 8
    sort_memory: 2G
  markdup:
    threads: 8
  bamstat:
    threads: 4
  alignment_qc:
    threads: 2
  gatk_hc:
    threads: 4
    memory: 10g
  gatk_joint:
    threads: 4
    memory: 160g
  gatk_filter:
    threads: 4
    memory: 100g
  bcftools_call:
    threads: 4
  sv_manta:
    threads: 8
  sv_delly:
    threads: 1

mapping_qc:
  enabled: true
  metric: picard_pct_pf_reads_aligned
  action: mark
  warn_below: 0.85
  drop_below: null
  use_flagstat: true

gatk_filters:
  snp: "QD < 2.0 || FS > 60.0 || MQ < 40.0 || SOR > 3.0 || MQRankSum < -12.5 || ReadPosRankSum < -8.0"
  indel: "QD < 2.0 || FS > 200.0 || SOR > 10.0 || MQRankSum < -12.5 || ReadPosRankSum < -20.0"

sv:
  callers: [manta, delly]
  delly_mapq: 20
  manta_callregions: null
  octopusv_max_distance: 300
  octopusv_min_support: 2
