# ============================================================
# `target` syntax grammar (consumed by tests/check_v132_mapping.py):
#
#   target := "full §<digit>" ("+" tail)*
#         |  "extension <ext_id>"
#         |  "omit"
#   tail   := "§<digit>"
#         |  "extension <ext_id>"
#
# Examples:
#   "full §0"
#   "full §0 + extension domain_cohort"
#   "full §1 + §2"
#   "extension domain_stat_a"
# ============================================================

# Gold-standard mapping: v1.3.2 539 lines -> core sections + extensions + omit
# Pass condition (§14.1): mapped lines >= 485 (>= 90% of 539)
# check_v132_mapping.py validates this fixture against the actual file.

source_file: "/path/to/project/archive/legacy_results/v1.3.2/provenance.md"
total_lines: 539

