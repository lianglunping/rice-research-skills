name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install BLAST (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - name: Install BLAST (macOS)
        if: runner.os == 'macOS'
        run: brew install blast
      - run: blastn -version
      - run: bash scripts/validate_skills.sh
      - run: python -m pip install -r requirements-test.txt
      - run: bash scripts/test_skills.sh
